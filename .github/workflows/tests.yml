name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    name: ${{ matrix.engine }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        engine: [gemini, agy]
    runs-on: ${{ matrix.os }}
    env:
      CLC_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GNU coreutils (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Configure git
        run: |
          git config --global user.name ci
          git config --global user.email ci@local
          git config --global init.defaultBranch main
      - name: Core suite
        shell: bash
        run: bash tests/run-tests.sh
      - name: Lifecycle suite
        shell: bash
        run: bash tests/run-lifecycle.sh
      - name: Merge atomicity suite
        shell: bash
        run: bash tests/run-merge-atomic.sh
      - name: Antigravity engine suite
        if: matrix.engine == 'agy'
        shell: bash
        run: bash tests/run-agy-engine.sh
